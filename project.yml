name: Piproom
packages:
  Alamofire:
    url: https://github.com/patrickmitchell81-eng/Alamofire
    revision: 9799237b84cbd97f80a3ac9b69b30ba65139f752
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 2
    SUPPORTS_MACCATALYST: 'NO'
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
targets:
  Piproom:
    type: application
    platform: iOS
    sources:
    - Piproom
    - Shared
    dependencies:
    - target: PiproomWidget
      embed: true
    - target: PiproomWatch
      embed: true
    - package: Alamofire
    entitlements:
      path: Piproom/Piproom.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.piproom.iphone
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.piproom.iphone
        INFOPLIST_KEY_CFBundleDisplayName: KOTOROOM
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos for monthly review or import verified originals into your Secret Folder.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Restore a selected Secret Folder photo to your Photos library.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Use Face ID to unlock your Secret Folder on this iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Piproom/Info.plist
      properties:
        PiproomEmailRangeURL: $(PIPROOM_HIBP_PROXY_URL)
        CFBundleURLTypes:
        - CFBundleURLName: app.piproom.iphone
          CFBundleURLSchemes:
          - piproom
        NSUserActivityTypes:
        - app.piproom.review
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  PiproomWidget:
    type: app-extension
    platform: iOS
    sources:
    - PiproomWidget
    - Shared
    entitlements:
      path: PiproomWidget/PiproomWidget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.piproom.iphone
    info:
      path: PiproomWidget/Info.plist
      properties:
        CFBundleDisplayName: Piproom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.piproom.iphone.widget
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
  PiproomWatch:
    type: application
    platform: watchOS
    sources:
    - PiproomWatch
    - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '4'
        PRODUCT_BUNDLE_IDENTIFIER: app.piproom.iphone.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: KOTOROOM
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.piproom.iphone
        ASSETCATALOG_COMPILER_APPICON_NAME: PiproomWatchIcon
        SKIP_INSTALL: 'YES'
  PiproomVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - PiproomVaultTests
    dependencies:
    - target: Piproom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piproom.iphone.vault-tests
        TARGETED_DEVICE_FAMILY: '1'
  PiproomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - PiproomUITests
    dependencies:
    - target: Piproom
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.piproom.iphone.uitests
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Create review fixtures on the test iPhone.
schemes:
  Piproom:
    build:
      targets:
        Piproom: all
    test:
      targets:
      - PiproomVaultTests
      - PiproomUITests
  PiproomWatch:
    build:
      targets:
        PiproomWatch: all
